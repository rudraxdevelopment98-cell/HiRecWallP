<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: SG; src: url(fonts/space-grotesk-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: SG; src: url(fonts/space-grotesk-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Int; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: Int; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: Int; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
/* Site "Craft" theme tokens. */
:root { --bg: hsl(210 22% 98%); --fg: hsl(222 24% 12%); --muted: hsl(220 9% 46%); --border: hsl(220 14% 90%); --accent: hsl(221 83% 53%); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Int, sans-serif; -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; overflow: hidden; opacity: 0; background: var(--bg); }
.glow { position: absolute; border-radius: 50%; filter: blur(70px); }
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.cam img { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.ring { position: absolute; border-radius: 12px; box-shadow: 0 0 0 4px var(--accent), 0 0 0 9999px rgba(15, 23, 42, .32); }
.cursor { position: absolute; width: 34px; height: 34px; margin: -4px 0 0 -6px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
.ripple { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid var(--accent); }
.cap { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; padding: 18px 30px 18px 18px; border-radius: 22px; background: #fff; box-shadow: 0 0 0 1px var(--border), 0 18px 40px -16px hsl(222 24% 12% / .35); max-width: 1500px; }
.cap .n { min-width: 64px; height: 64px; border-radius: 16px; background: var(--fg); color: #fff; display: grid; place-items: center; font: 700 26px SG; padding: 0 10px; }
.cap .t { font: 600 34px SG; letter-spacing: -.02em; white-space: nowrap; }
.cap .c { font: 500 17px Int; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; margin-bottom: 4px; }
.serif { font-family: SG; font-weight: 700; letter-spacing: -.03em; }
.grad { background: linear-gradient(95deg, hsl(221 83% 53%), hsl(262 75% 58%)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.label { font: 600 20px Int; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.list { display: grid; gap: 14px 60px; }
.list div { display: flex; gap: 16px; align-items: center; font: 500 26px Int; color: var(--fg); }
.list b { min-width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 1px var(--border); font: 700 19px SG; }
.btn { display: inline-flex; border-radius: 99px; padding: 16px 34px; background: var(--fg); color: #fff; font: 600 26px Int; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const PLAN = window.PLAN; // { chapter, items: [...] }
const root = document.getElementById('root');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const h = (tag, cls, style, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; if (html != null) e.innerHTML = html; return e; };
const W = 1920, H = 1080;
function glows(el) {
  el.append(h('div', 'glow', 'left:-200px;top:-200px;width:1100px;height:700px;background:hsl(221 90% 60% / .16)'),
            h('div', 'glow', 'right:-200px;top:-150px;width:1000px;height:650px;background:hsl(270 80% 65% / .14)'));
}
function rise(el, t, a, d = .7) { const p = eo(lin(t, a, a + d)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 24}px)`; }

function introLayer(it) {
  const L = h('div', 'layer'); glows(L);
  const lab = h('div', 'label', 'position:absolute;left:150px;top:150px', `HirecWallp guide · ${PLAN.audienceLabel}`);
  const t = h('div', 'serif', 'position:absolute;left:150px;top:200px;font-size:92px;line-height:1.05;max-width:1600px', it.title);
  const s = h('div', '', 'position:absolute;left:150px;top:330px;font:400 30px Int;color:var(--muted);max-width:1500px', it.summary);
  const cols = it.steps.length > 5 ? 2 : 1;
  const list = h('div', 'list', `position:absolute;left:150px;top:430px;grid-template-columns:repeat(${cols}, 760px)`);
  const rows = it.steps.map((x, i) => { const r = h('div', '', '', `<b>${i + 1}</b><span>${x}</span>`); list.append(r); return r; });
  L.append(lab, t, s, list); root.append(L);
  return (lt) => { rise(lab, lt, .1); rise(t, lt, .25); rise(s, lt, .5); rows.forEach((r, i) => rise(r, lt, .8 + i * .12, .5)); };
}

function outroLayer(it) {
  const L = h('div', 'layer'); glows(L);
  const lab = h('div', 'label', 'position:absolute;left:0;right:0;top:330px;text-align:center', it.next ? 'Up next' : 'That’s the tour');
  const t = h('div', 'serif', 'position:absolute;left:0;right:0;top:380px;text-align:center;font-size:84px', it.next ? `<span class="grad">${it.next}</span>` : 'Thanks for watching');
  const u = h('div', '', 'position:absolute;left:0;right:0;top:560px;text-align:center', `<span class="btn">${it.url}</span>`);
  const s = h('div', '', 'position:absolute;left:0;right:0;top:660px;text-align:center;font:400 26px Int;color:var(--muted)', 'Step-by-step guide with pictures');
  L.append(lab, t, u, s); root.append(L);
  return (lt) => { rise(lab, lt, .1); rise(t, lt, .3); rise(u, lt, .7); rise(s, lt, .9); };
}

// Camera framing for a highlight box (fractions): zoom so the box fills ~60% of the frame, never below 1×.
function frameFor(b) {
  if (!b) return { s: 1, x: 0, y: 0 };
  const bw = b.w * W, bh = b.h * H;
  const s = clamp(Math.min((W * .62) / bw, (H * .55) / bh), 1, 1.75);
  const cx = (b.x + b.w / 2) * W, cy = (b.y + b.h / 2) * H;
  // translate so the box centre sits slightly above frame centre (caption lives at the bottom), clamped to the image.
  let x = W / 2 - cx * s, y = H * .45 - cy * s;
  x = clamp(x, W - W * s, 0); y = clamp(y, H - H * s, 0);
  return { s, x, y };
}

function stepLayer(it, prevPoint) {
  const L = h('div', 'layer');
  const cam = h('div', 'cam');
  const img = h('img'); img.src = it.img;
  cam.append(img);
  const b = it.box;
  let ring = null, cur = null, rip = null;
  const tgt = b ? { x: (b.x + b.w / 2) * W, y: (b.y + b.h / 2) * H } : { x: W * .5, y: H * .5 };
  if (b) {
    ring = h('div', 'ring', `left:${b.x * W}px;top:${b.y * H}px;width:${b.w * W}px;height:${b.h * H}px;opacity:0`);
    rip = h('div', 'ripple', `left:${tgt.x}px;top:${tgt.y}px;opacity:0`);
    cur = h('div', 'cursor', '', '<svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 2.5 L4 19 L8.6 14.8 L11.6 21.4 L14.4 20.1 L11.5 13.6 L17.8 13.6 Z" fill="#11151F" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>');
    cam.append(ring, rip, cur);
  }
  L.append(cam);
  const cap = h('div', 'cap', '', `<div class="n">${it.n}/${it.total}</div><div><div class="c">${PLAN.chapterTitle}</div><div class="t">${it.title}</div></div>`);
  L.append(cap);
  root.append(L);
  const F = frameFor(b);
  const from = prevPoint || { x: W * .5, y: H * .62 };
  return (lt) => {
    const z = eio(lin(lt, .35, 1.45));
    const s = 1 + (F.s - 1) * z, x = F.x * z, y = F.y * z;
    cam.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    if (b) {
      const m = eio(lin(lt, .3, 1.35));
      const cx = from.x + (tgt.x - from.x) * m, cy = from.y + (tgt.y - from.y) * m;
      cur.style.left = `${cx}px`; cur.style.top = `${cy}px`;
      cur.style.opacity = lin(lt, 0, .3) * (1 - lin(lt, it.dur - .8, it.dur - .4));
      cur.style.transform = `scale(${1 / s})`;
      const rp = lin(lt, 1.35, 1.95);
      rip.style.opacity = rp > 0 && rp < 1 ? 1 - rp : 0; rip.style.transform = `scale(${(.4 + rp) / s})`;
      ring.style.opacity = eo(lin(lt, 1.35, 1.8));
      ring.style.boxShadow = `0 0 0 ${4 / s}px hsl(221 83% 53%), 0 0 0 9999px rgba(15, 23, 42, ${.32 * eo(lin(lt, 1.35, 1.8))})`;
    }
    const cp = eo(lin(lt, .2, .8));
    cap.style.opacity = cp; cap.style.transform = `translate(-50%, ${(1 - cp) * 30}px)`;
  };
}

let prevPoint = null;
const layers = PLAN.items.map((it) => {
  let upd;
  if (it.type === 'intro') upd = introLayer(it);
  else if (it.type === 'outro') upd = outroLayer(it);
  else { upd = stepLayer(it, prevPoint); if (it.box) prevPoint = { x: (it.box.x + it.box.w / 2) * W, y: (it.box.y + it.box.h / 2) * H }; }
  return { ...it, el: root.lastChild, upd };
});
const XF = .35;
window.renderAt = (T) => {
  layers.forEach((l, i) => {
    const lt = T - l.start;
    const vis = lt > -XF && lt < l.dur + XF;
    l.el.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const a = i === 0 ? 1 : eo(lin(lt, -XF, XF));
    const b = i === layers.length - 1 ? 1 - lin(lt, l.dur - .5, l.dur) : 1;
    l.el.style.opacity = Math.min(a, b);
    l.el.style.zIndex = i;
    l.upd(Math.max(0, lt));
  });
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
</script>
</body>
</html>
