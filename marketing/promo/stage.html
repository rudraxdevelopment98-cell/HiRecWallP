<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: SG; src: url(fonts/space-grotesk-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: SG; src: url(fonts/space-grotesk-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: SG; src: url(fonts/space-grotesk-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Int; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: Int; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: Int; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
@font-face { font-family: IntD; src: url(fonts/InterDisplay-SemiBold.otf); font-weight: 600; }
@font-face { font-family: IntD; src: url(fonts/InterDisplay-Bold.otf); font-weight: 700; }
/* Site "Craft" theme: soft cool white, ink text, blue accent, blue/violet glows. */
:root {
  --bg: hsl(210 22% 98%); --fg: hsl(222 24% 12%); --muted: hsl(220 9% 46%); --border: hsl(220 14% 90%);
  --secondary: hsl(220 16% 96%); --accent: hsl(221 83% 53%); --violet: hsl(262 75% 58%); --u: 1vmin;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Int, sans-serif; -webkit-font-smoothing: antialiased; }
.scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; background: var(--bg); }
.abs { position: absolute; }
.fill { position: absolute; inset: 0; }
.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.serif { font-family: SG, sans-serif; font-weight: 600; letter-spacing: -.025em; line-height: 1.08; color: var(--fg); }
.it { font-style: normal; }
.gold { background: linear-gradient(95deg, hsl(221 83% 53%) 0%, hsl(262 75% 58%) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.label { font-family: Int; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: calc(var(--u) * 1.45); color: var(--accent); }
.small { font-size: calc(var(--u) * 2); color: var(--muted); line-height: 1.45; }
.fine { font-size: calc(var(--u) * 1.45); color: var(--muted); line-height: 1.4; }
.glow { position: absolute; border-radius: 50%; filter: blur(calc(var(--u) * 7)); }
.vign { display: none; }
.phone { position: absolute; aspect-ratio: 9 / 19.5; border-radius: 13% / 6%; background: linear-gradient(160deg, #1f2430, #0b0e14 60%); padding: 2.2%; box-shadow: 0 calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*-3) hsl(222 24% 12% / .45), inset 0 1px 1px hsl(0 0% 100% / .12); }
.phone .scr { position: relative; width: 100%; height: 100%; border-radius: 11% / 5.2%; overflow: hidden; background: #000; }
.phone .island { position: absolute; top: 2.2%; left: 50%; width: 30%; height: 3.2%; transform: translateX(-50%); background: #000; border-radius: 99px; z-index: 3; }
.tablet { position: absolute; aspect-ratio: 4 / 3; border-radius: 4.5%; background: linear-gradient(160deg, #242a36, #0b0e14 60%); padding: 2.6%; box-shadow: 0 calc(var(--u)*4) calc(var(--u)*7) calc(var(--u)*-3) hsl(222 24% 12% / .45); }
.tablet .scr { position: relative; width: 100%; height: 100%; border-radius: 2.4%; overflow: hidden; }
.monitor { position: absolute; }
.monitor .bez { aspect-ratio: 16 / 9.6; background: linear-gradient(160deg, #1f2430, #0b0e14 60%); border-radius: calc(var(--u)*1.2); padding: 1.6%; box-shadow: 0 calc(var(--u)*5) calc(var(--u)*8) calc(var(--u)*-3) hsl(222 24% 12% / .4); }
.monitor .scr { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--u)*.4); }
.monitor .neck { width: 14%; height: calc(var(--u)*5); margin: 0 auto; background: linear-gradient(#2a303c, #1a1f28); }
.monitor .foot { width: 30%; height: calc(var(--u)*.9); margin: 0 auto; border-radius: 99px; background: linear-gradient(#2a303c, #10141b); }
.browser { position: absolute; border-radius: calc(var(--u)*1.4); overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--border), 0 calc(var(--u)*5) calc(var(--u)*9) calc(var(--u)*-3) hsl(222 24% 12% / .28); }
.browser .bar { height: calc(var(--u)*3.2); background: var(--secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: calc(var(--u)*.8); padding: 0 calc(var(--u)*1.4); }
.browser .bar i { width: calc(var(--u)*1); height: calc(var(--u)*1); border-radius: 50%; background: hsl(220 14% 82%); display: block; }
.browser .bar span { margin-left: calc(var(--u)*1.5); flex: 1; height: calc(var(--u)*1.9); border-radius: 99px; background: #fff; border: 1px solid var(--border); color: var(--muted); font-size: calc(var(--u)*1.1); display: flex; align-items: center; padding-left: calc(var(--u)*1.2); }
.browser .view { position: relative; overflow: hidden; }
.browser .view img { width: 100%; display: block; }
.clock { position: absolute; left: 0; right: 0; text-align: center; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
.cmp { position: absolute; border-radius: calc(var(--u)*2); overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--border), 0 calc(var(--u)*2) calc(var(--u)*6) calc(var(--u)*-2) hsl(222 24% 12% / .14); }
.cmp .row { display: grid; grid-template-columns: 1.05fr 1fr 1.25fr; align-items: center; border-top: 1px solid var(--border); }
.cmp .row > div { padding: calc(var(--u)*1.55) calc(var(--u)*2); font-size: calc(var(--u)*1.9); }
.cmp .head > div { font-size: calc(var(--u)*1.4); letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--muted); border-top: 0; background: var(--secondary); }
.cmp .k { color: var(--fg); font-weight: 500; }
.cmp .bad { color: var(--muted); }
.cmp .bad b { color: hsl(350 70% 52%); font-weight: 700; margin-right: .5em; }
.cmp .good { color: var(--fg); font-weight: 500; background: hsl(221 90% 97%); }
.cmp .good b { color: hsl(152 60% 38%); margin-right: .5em; }
.card { position: absolute; border-radius: calc(var(--u)*2); background: #fff; box-shadow: 0 0 0 1px var(--border), 0 1px 2px hsl(222 24% 12% / .04), 0 calc(var(--u)*1.6) calc(var(--u)*4) calc(var(--u)*-1.6) hsl(222 24% 12% / .12); }
.card.goldline { box-shadow: 0 0 0 2px var(--fg), 0 calc(var(--u)*2.4) calc(var(--u)*6) calc(var(--u)*-2) hsl(222 24% 12% / .25); }
.pill { display: inline-flex; align-items: center; gap: .6em; border-radius: 99px; padding: .55em 1.2em; font-size: calc(var(--u) * 1.6); font-weight: 500; background: #fff; color: var(--fg); box-shadow: 0 0 0 1px var(--border), 0 1px 2px hsl(222 24% 12% / .05); }
.btn { display: inline-flex; align-items: center; border-radius: 99px; padding: .8em 1.8em; font-weight: 600; background: var(--fg); color: #fff; }
.num { font-family: SG; font-weight: 700; letter-spacing: -.03em; color: var(--fg); }
.center { left: 0; right: 0; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const Q = new URLSearchParams(location.search);
const VIDEO = Q.get('video') || 'buyer';
const PORT = innerHeight > innerWidth;
const vmin = Math.min(innerWidth, innerHeight) / 100;
const root = document.getElementById('root');
const art = (n) => `art/${n}-${PORT ? 'p' : 'l'}.jpg`;
const artL = (n) => `art/${n}-l.jpg`;
const artP = (n) => `art/${n}-p.jpg`;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ease = (t, a, b) => eo(lin(t, a, b));
function h(tag, cls, style, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (style) e.style.cssText = style;
  if (html != null) e.innerHTML = html;
  return e;
}
function add(parent, ...kids) { kids.forEach((k) => parent.appendChild(k)); return parent; }
// fade+rise reveal: element appears at time a over d seconds
function rise(el, t, a, d = .9, dist = 2.2) {
  const p = ease(t, a, a + d);
  el.style.opacity = p;
  el.style.transform = `translateY(${(1 - p) * dist}vmin)`;
}
function fade(el, t, a, d = .8) { el.style.opacity = ease(t, a, a + d); }
function out(el, t, a, d = .6) { const p = 1 - ease(t, a, a + d); el.style.opacity = Math.min(parseFloat(el.style.opacity || 1), p); }
const MARK = (stroke = 'hsl(222 24% 12%)', w = 2.1) => `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;overflow:visible">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3b4"/><stop offset=".5" stop-color="#d4ad66"/><stop offset="1" stop-color="#9a7438"/></linearGradient></defs>
  <path class="mk" pathLength="1" d="M2.5 19.5 L9 8 L13.6 15.6"/><path class="mk" pathLength="1" d="M11.7 12.5 L15 7 L21.5 19.5"/><path class="mk" pathLength="1" d="M2.5 19.5 H21.5"/>
  <circle class="sun" cx="19.2" cy="4.6" r="1.6" fill="hsl(222 24% 12%)" stroke="none"/></svg>`;

function phone(x, y, hgt, inner) {
  const p = h('div', 'phone', `left:${x}px;top:${y}px;height:${hgt}px`);
  const s = h('div', 'scr');
  add(p, h('div', 'island'), s);
  if (inner) add(s, inner);
  return p;
}
function lockscreen(src, scale = 1) {
  const w = h('div', 'fill');
  const img = h('img', 'cover'); img.src = src;
  add(w, img,
    h('div', 'clock', `top:14%;font-family:Int;font-weight:500;font-size:${1.7 * scale}vmin;opacity:.9`, 'Friday, 6 November'),
    h('div', 'clock num', `top:17%;font-size:${8.2 * scale}vmin;font-weight:600`, '9:41'));
  return w;
}
function browser(x, y, w, hgt, src, url) {
  const b = h('div', 'browser', `left:${x}px;top:${y}px;width:${w}px`);
  const bar = h('div', 'bar', '', `<i></i><i></i><i></i><span>${url}</span>`);
  const v = h('div', 'view', `height:${hgt}px`);
  const img = h('img'); img.src = src;
  add(v, img); add(b, bar, v);
  b.img = img;
  return b;
}
function lightBg(scene) {
  add(scene, h('div', 'glow', 'left:-10vw;top:-15vh;width:60vw;height:60vh;background:hsl(221 90% 60% / .16)'), h('div', 'glow', 'right:-10vw;top:-10vh;width:55vw;height:55vh;background:hsl(270 80% 65% / .14)'), h('div', 'glow', 'left:25vw;bottom:-30vh;width:50vw;height:50vh;background:hsl(200 90% 60% / .08)'));
}
function bgArt(scene, src, dim = .55, blur = 0) {
  lightBg(scene); return null;
  const img = h('img', 'cover', `filter:brightness(${1 - dim}) ${blur ? `blur(${blur}vmin)` : ''};transform:scale(1.1)`); img.src = src;
  add(scene, img);
  return img;
}
function compareTable(scene, W, rows, cols) {
  const t = h('div', 'cmp', `left:${(innerWidth - W) / 2}px;width:${W}px;`);
  const head = h('div', 'row head', '', `<div></div><div>${cols[0]}</div><div style="color:hsl(221 83% 53%);background:hsl(221 90% 97%)">${cols[1]}</div>`);
  add(t, head);
  const rs = rows.map(([k, bad, good]) => {
    const r = h('div', 'row', '', `<div class="k">${k}</div><div class="bad"><b>✕</b>${bad}</div><div class="good"><b>✓</b>${good}</div>`);
    add(t, r);
    return r;
  });
  add(scene, t);
  return { el: t, rows: rs };
}

// ---------- scenes ----------
const S = {};

S.buyer_hook = (sc, D) => {
  lightBg(sc);
  const ph = PORT ? 52 * vmin * 1.9 : 70 * vmin;
  const pw = ph * 9 / 19.5;
  const px = PORT ? (innerWidth - pw) / 2 : innerWidth * .62 - pw / 2;
  const py = PORT ? innerHeight * .1 : (innerHeight - ph) / 2;
  const ls = lockscreen(artP('liquid-gold'), PORT ? 1.4 : 1);
  const p = phone(px, py, ph, ls);
  add(sc, p);
  const tx = h('div', 'abs', PORT ? `left:8vw;right:8vw;bottom:9vh;text-align:center` : `left:9vw;top:34vh;width:44vw`);
  const lab = h('div', 'label', 'margin-bottom:3vmin', 'HirecWallp');
  const l1 = h('div', 'serif', `font-size:${PORT ? 7.6 : 6}vmin`, 'The screen you see most');
  const l2 = h('div', 'serif it gold', `font-size:${PORT ? 9 : 7.4}vmin;margin-top:1vmin`, 'is your own.');
  add(tx, lab, l1, l2); add(sc, tx);
  return (t) => {
    const on = ease(t, .9, 2.2);
    ls.style.opacity = on;
    ls.style.filter = `brightness(${.4 + .6 * on})`;
    p.style.transform = `perspective(1400px) rotateY(${(PORT ? 0 : -14) * (1 - ease(t, 0, D))}deg) scale(${.94 + .06 * ease(t, 0, D)})`;
    rise(lab, t, .3); rise(l1, t, .6); rise(l2, t, 2.0);
  };
};

S.buyer_beauty = (sc, D) => {
  lightBg(sc);
  const names = [['liquid-gold', 'Liquid Gold'], ['dusk-peaks', 'Dusk Peaks'], ['obsidian-marble', 'Obsidian Marble'], ['violet-nebula', 'Violet Nebula']];
  const seg = D / names.length;
  const frame = h('div', 'abs', `left:${PORT ? 6 : 7}vw;right:${PORT ? 6 : 7}vw;top:${PORT ? 25 : 27}vh;bottom:${PORT ? 7 : 7}vh;border-radius:3vmin;overflow:hidden;background:#0b0e14;box-shadow:0 0 0 1px hsl(220 14% 90%),0 5vmin 9vmin -3vmin hsl(222 24% 12% / .35)`);
  add(sc, frame);
  const imgs = names.map(([n]) => { const i = h('img', 'cover'); i.src = art(n); add(frame, i); return i; });
  add(frame, h('div', 'fill', 'background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.6) 100%)'));
  const head = h('div', 'abs center', `top:${PORT ? 8 : 7}vh`);
  const h1 = h('div', 'serif', `font-size:${PORT ? 7.6 : 6.2}vmin`, 'Give it something');
  const h2 = h('div', 'serif it gold', `font-size:${PORT ? 7.6 : 6.2}vmin`, 'truly beautiful.');
  add(head, h1, h2); add(sc, head);
  const cap = h('div', 'abs', `left:3.4vmin;bottom:3vmin`);
  const lab = h('div', 'label', 'color:rgba(255,255,255,.85)', 'Ultra-HD · 4K');
  const ttl = h('div', 'serif', `color:#fff;font-size:${PORT ? 5.4 : 4.2}vmin;margin-top:1vmin`);
  add(cap, lab, ttl); add(frame, cap);
  return (t) => {
    imgs.forEach((im, i) => {
      const a = i * seg;
      const vis = i === 0 ? 1 - ease(t, a + seg - .3, a + seg + .5) : ease(t, a - .3, a + .5) * (i === imgs.length - 1 ? 1 : 1 - ease(t, a + seg - .3, a + seg + .5));
      im.style.opacity = vis;
      const k = lin(t, a - .5, a + seg + .5);
      im.style.transform = `scale(${1.04 + .08 * k}) translate(${(i % 2 ? -1 : 1) * 1.2 * k}vmin, ${-.8 * k}vmin)`;
    });
    rise(h1, t, .2); rise(h2, t, 1.0);
    const idx = Math.min(names.length - 1, Math.floor((t + .1) / seg));
    if (ttl.textContent !== names[idx][1]) ttl.textContent = names[idx][1];
    rise(cap, t, .8);
    const local = t - idx * seg;
    ttl.style.opacity = idx === 0 ? 1 : ease(local, 0, .6);
  };
};

S.buyer_devices = (sc, D) => {
  lightBg(sc);
  const half = D * .52;
  const grp = h('div', 'fill');
  add(sc, grp);
  let mon, tab, ph;
  if (!PORT) {
    const mw = innerWidth * .46;
    mon = h('div', 'monitor', `left:${innerWidth * .2}px;top:${innerHeight * .27}px;width:${mw}px`);
    const ms = h('div', 'scr'); const mi = h('img', 'cover'); mi.src = artL('dusk-peaks'); add(ms, mi);
    add(mon, add(h('div', 'bez'), ms), h('div', 'neck'), h('div', 'foot'));
    const tw = innerWidth * .2;
    tab = h('div', 'tablet', `left:${innerWidth * .6}px;top:${innerHeight * .44}px;width:${tw}px`);
    const ts = h('div', 'scr'); const ti = h('img', 'cover'); ti.src = artL('dusk-peaks'); add(ts, ti); add(tab, ts);
    ph = phone(innerWidth * .74, innerHeight * .4, innerHeight * .44, lockscreen(artP('dusk-peaks'), .62));
  } else {
    const mw = innerWidth * .84;
    mon = h('div', 'monitor', `left:${innerWidth * .08}px;top:${innerHeight * .3}px;width:${mw}px`);
    const ms = h('div', 'scr'); const mi = h('img', 'cover'); mi.src = artL('dusk-peaks'); add(ms, mi);
    add(mon, add(h('div', 'bez'), ms), h('div', 'neck'), h('div', 'foot'));
    tab = h('div', 'tablet', `left:${innerWidth * .06}px;top:${innerHeight * .58}px;width:${innerWidth * .5}px`);
    const ts = h('div', 'scr'); const ti = h('img', 'cover'); ti.src = artL('dusk-peaks'); add(ts, ti); add(tab, ts);
    ph = phone(innerWidth * .62, innerHeight * .55, innerHeight * .34, lockscreen(artP('dusk-peaks'), .8));
  }
  add(grp, mon, tab, ph);
  const head = h('div', 'abs center', `top:${PORT ? 9 : 8}vh`);
  const l = h('div', 'label', 'margin-bottom:2vmin', 'Phone · Tablet · Desktop');
  const h1 = h('div', 'serif', `font-size:${PORT ? 8 : 6.2}vmin`, 'Every size. <span class="it gold">Every screen.</span>');
  add(head, l, h1); add(sc, head);
  // phase B: live preview on the real site
  const B = h('div', 'fill');
  add(sc, B);
  let shot;
  if (!PORT) {
    const bw = innerWidth * .56, bh = bw * 1350 / 2160 * .86;
    shot = browser(innerWidth * .38, innerHeight * .2, bw, bh, 'shots/c-detail.jpg', 'hirecwallp.com/w/liquid-gold');
  } else {
    const hh = innerHeight * .6;
    shot = phone((innerWidth - hh * 9 / 19.5) / 2, innerHeight * .3, hh, (() => { const i = h('img', '', 'width:100%;display:block'); i.src = 'shots/c-m-detail.jpg'; return i; })());
  }
  add(B, shot);
  const bt = h('div', 'abs', PORT ? 'left:8vw;right:8vw;top:9vh;text-align:center' : 'left:7vw;top:36vh;width:28vw');
  const bl = h('div', 'label', 'margin-bottom:2vmin', 'Live device preview');
  const bh1 = h('div', 'serif', `font-size:${PORT ? 7.6 : 5.8}vmin`, 'Try it on <span class="it gold">your</span> screen');
  const bh2 = h('div', 'serif it', `font-size:${PORT ? 5 : 3.6}vmin;margin-top:1.4vmin;color:hsl(220 9% 40%)`, 'before you buy.');
  add(bt, bl, bh1, bh2); add(B, bt);
  return (t) => {
    [mon, tab, ph].forEach((d, i) => { const p = ease(t, .2 + i * .35, 1.3 + i * .35); d.style.opacity = p; d.style.transform = `translateY(${(1 - p) * 6}vmin)`; });
    rise(l, t, .1); rise(h1, t, .4);
    const g = 1 - ease(t, half - .2, half + .6);
    grp.style.opacity = g; head.style.opacity = g;
    grp.style.transform = `scale(${1 + .04 * lin(t, 0, half)})`;
    B.style.opacity = ease(t, half, half + .8);
    rise(bl, t, half + .2); rise(bh1, t, half + .4); rise(bh2, t, half + .9);
    shot.style.transform = `translateY(${(1 - ease(t, half, half + 1.1)) * 5}vmin) scale(${1 + .02 * lin(t, half, D)})`;
    if (PORT) { const img = shot.querySelector('img'); img.style.transform = `translateY(${-lin(t, half + 1.5, D) * 18}%)`; }
  };
};

function compareScene(sc, D, title, sub, cols, rows, note, bgName) {
  bgArt(sc, art(bgName), .78, .6);
  add(sc, h('div', 'vign'));
  const head = h('div', 'abs center', `top:${PORT ? 10 : 9}vh;padding:0 6vw`);
  const lab = h('div', 'label', 'margin-bottom:2vmin', sub);
  const h1 = h('div', 'serif', `font-size:${PORT ? 7 : 5.6}vmin`, title);
  add(head, lab, h1); add(sc, head);
  const W = PORT ? innerWidth * .92 : innerWidth * .78;
  sc.style.setProperty('--u', `${vmin * (PORT ? 1.7 : 1.42)}px`);
  const tb = compareTable(sc, W, rows, cols);
  tb.el.style.top = `${PORT ? innerHeight * .25 : innerHeight * .29}px`;
  const fn = h('div', 'abs center fine', `bottom:${PORT ? 6 : 5}vh;padding:0 8vw`, note);
  add(sc, fn);
  return (t) => {
    rise(lab, t, .1); rise(h1, t, .3);
    rise(tb.el, t, .6, 1, 3);
    const span = D * .62;
    tb.rows.forEach((r, i) => {
      const a = 1.2 + i * (span / rows.length);
      const p = ease(t, a, a + .7);
      r.style.opacity = .12 + .88 * p;
      const g = r.querySelector('.good');
      g.style.boxShadow = `inset 0 0 ${p * 2}vmin hsl(221 83% 53% / ${.25 * (1 - lin(t, a + .7, a + 2))})`;
    });
    fade(fn, t, 1.5);
  };
}

S.buyer_compare = (sc, D) => compareScene(sc, D,
  'Not just another <span class="it gold">free download.</span>', 'The difference',
  ['Typical free download', 'HirecWallp'],
  [
    ['Image quality', 'Often compressed', 'Full-quality 4K file'],

S.creator_cta = (sc, D) => ctaScene(sc, D, ['Create.', 'Upload.', 'Earn.'], 'hirecwallp.com/creator');

// ---------- timeline ----------
const PLAN = window.PLAN; // [{id, start, dur}]
const scenes = PLAN.map((p) => {
  const el = h('div', 'scene'); add(root, el);
  const upd = S[`${VIDEO}_${p.id}`](el, p.dur);
  return { ...p, el, upd };
});
const XF = .45;
window.renderAt = (T) => {
  for (const s of scenes) {
    const lt = T - s.start;
    const visible = lt > -XF && lt < s.dur + XF;
    s.el.style.display = visible ? 'block' : 'none';
    if (!visible) continue;
    const first = s === scenes[0], last = s === scenes[scenes.length - 1];
    const a = first ? 1 : ease(lt, -XF, XF);
    const b = last ? 1 - ease(lt, s.dur - .6, s.dur) : 1 - lin(lt, s.dur - XF, s.dur + XF);
    s.el.style.opacity = Math.min(a, b);
    s.el.style.zIndex = scenes.indexOf(s);
    s.upd(Math.max(0, lt));
  }
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
</script>
